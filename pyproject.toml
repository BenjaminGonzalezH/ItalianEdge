[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biocluster"
version = "1.0.3"
description = "Toolkit for gene clustering characterization"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  {name = "Mario Inostroza Ponta", email = "mario.inostroza@usach.cl"},
  {name = "Benjamín González Hurtado", email = "benjamin.gonzalez.h@usach.cl"}
]

keywords = [
  "bioinformatics",
  "gene ontology",
  "clustering",
  "ensemble clustering",
  "semantic similarity",
  "GO visualization"
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent"
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "networkx>=3.0",
  "plotly>=5.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "goatools>=1.3",
  "gprofiler-official>=1.0",
  "mygene>=3.2",
  "go3>=0.3.0",
  "pyarrow>=14.0",
  "holoviews>=1.19"
]

[project.urls]
Homepage = "https://github.com/BenjaminGonzalezH/ItalianEdge"
Repository = "https://github.com/BenjaminGonzalezH/ItalianEdge"
Issues = "https://github.com/BenjaminGonzalezH/ItalianEdge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Examples deliberately configure the runtime environment (env vars,
# multiprocessing start method) before importing biocluster.
"examples/*.py" = ["E402"]
"examples/*.ipynb" = ["E402"]
# All *Options default arguments across biocluster are frozen (immutable)
# dataclasses, so B008's shared-mutable-default concern does not apply.
"src/biocluster/**/*.py" = ["B008"]

[tool.mypy]
ignore_missing_imports = true

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "black",
  "ruff",
  "mypy"
]
